<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- ZODI Orbital Icon — neon green on black -->
  <defs>
    <radialGradient id="rbg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0c1f00"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="rglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#9cff00" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#9cff00" stop-opacity="0"/>
    </radialGradient>
    <filter id="fbloom">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fglow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Base circle -->
  <circle cx="256" cy="256" r="256" fill="url(#rbg)"/>
  <circle cx="256" cy="256" r="200" fill="url(#rglow)"/>

  <!-- Sphere grid — longitude lines -->
  <g stroke="#9cff00" stroke-width="1.8" stroke-opacity="0.3" fill="none">
    <line x1="256" y1="76"  x2="256" y2="436"/>
    <ellipse cx="256" cy="256" rx="70"  ry="180"/>
    <ellipse cx="256" cy="256" rx="130" ry="180"/>
  </g>
  <!-- Sphere grid — latitude lines -->
  <g stroke="#9cff00" stroke-width="1.8" stroke-opacity="0.3" fill="none">
    <line x1="76"  y1="256" x2="436" y2="256"/>
    <ellipse cx="256" cy="180" rx="180" ry="50"/>
    <ellipse cx="256" cy="332" rx="180" ry="50"/>
  </g>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="180" stroke="#9cff00" stroke-width="4" fill="none" filter="url(#fglow)"/>
  <!-- Inner ring -->
  <circle cx="256" cy="256" r="105" stroke="#9cff00" stroke-width="2.5" fill="none" stroke-opacity="0.65"/>

  <!-- Orbital ellipse (tilted ~-28deg) -->
  <ellipse cx="256" cy="256" rx="224" ry="68"
    stroke="#ffffff" stroke-width="3.5"
    fill="none" opacity="0.9"
    transform="rotate(-28 256 256)"
    filter="url(#fglow)"/>

  <!-- Orbital nodes -->
  <g filter="url(#fbloom)">
    <circle cx="406" cy="158" r="16" fill="#b4ff20"/>
    <circle cx="406" cy="158" r="9"  fill="#eeff99"/>
    <circle cx="106" cy="354" r="16" fill="#b4ff20"/>
    <circle cx="106" cy="354" r="9"  fill="#eeff99"/>
    <circle cx="444" cy="274" r="11" fill="#9cff00"/>
    <circle cx="444" cy="274" r="6"  fill="#d4ff4d"/>
  </g>

  <!-- 4-point star / sparkle center -->
  <g filter="url(#fbloom)">
    <path d="M256 194 L264 246 L256 298 L248 246 Z" fill="#ffffff"/>
    <path d="M194 256 L246 264 L298 256 L246 248 Z" fill="#ffffff"/>
    <circle cx="256" cy="256" r="8" fill="#ffffff"/>
  </g>

  <!-- Small sparkle dots -->
  <g fill="#ffffff" opacity="0.65">
    <circle cx="316" cy="175" r="3"/>
    <circle cx="353" cy="208" r="2"/>
    <circle cx="168" cy="306" r="2.5"/>
    <circle cx="200" cy="340" r="2"/>
    <circle cx="302" cy="320" r="2.5"/>
    <circle cx="152" cy="200" r="2"/>
    <circle cx="370" cy="340" r="2"/>
  </g>
