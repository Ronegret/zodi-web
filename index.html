  <body>
    <!-- Custom cursor (desktop only, injected below) -->
    <div id="cursor" aria-hidden="true"><div class="cur-dot" id="curDot"></div></div>

    <!-- React root -->
    <div id="root"></div>

    <!-- Service Worker registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.warn('[ZODI] SW registration failed:', err);
          });
        });
      }
    </script>

    <!-- Cursor effect: GPU-intensive WebGL sim, skip on touch/low-end devices -->
    <script>
      (function () {
        const noHover   = !window.matchMedia('(hover: hover) and (pointer: fine)').matches;
        const prefersLess = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const lowMemory = navigator.deviceMemory != null && navigator.deviceMemory < 4;
        if (noHover || prefersLess || lowMemory) return;
        var s = document.createElement('script');
        s.src = '/splash-cursor.js';
        s.async = true;
        document.body.appendChild(s);
      }());
    </script>
  </body>
