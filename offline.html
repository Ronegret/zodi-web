<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZODI — Sin conexión</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --acid: #9cff00;
      --bg:   #f7f8f1;
      --dark: #11131a;
      --gray: rgba(23,23,31,.64);
    }

    html, body {
      height: 100%;
      background:
        radial-gradient(circle at 10% 0%, rgba(156,255,0,.18), transparent 30%),
        linear-gradient(180deg, #fbfcf6 0%, #eef1e7 100%);
      font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
      color: var(--dark);
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100dvh;
      padding: 24px;
      text-align: center;
    }

    .card {
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(18,22,16,.12);
      border-radius: 16px;
      box-shadow: 0 24px 70px rgba(18,22,16,.12);
      padding: clamp(32px, 6vw, 56px) clamp(24px, 5vw, 48px);
      max-width: 440px;
      width: 100%;
    }

    .logo {
      display: block;
      width: 72px;
      height: 72px;
      margin: 0 auto 28px;
      background: var(--dark);
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 0 0 3px rgba(156,255,0,.42), 0 16px 40px rgba(0,0,0,.22);
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(156,255,0,.6));
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--acid);
      color: var(--dark);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(28px, 7vw, 40px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.01em;
      margin-bottom: 14px;
    }

    p {
      color: var(--gray);
      font-size: 15px;
      line-height: 1.65;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--dark);
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      border: none;
      border-radius: 10px;
      padding: 14px 28px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(17,19,26,.18);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 38px rgba(17,19,26,.22);
    }

    .hint {
      margin-top: 20px;
      font-size: 12px;
      color: var(--gray);
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="/zodi-logo.png" alt="ZODI" onerror="this.style.display='none'">
    </div>
    <span class="badge">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
        <circle cx="5" cy="5" r="4" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="5" cy="5" r="1.5" fill="currentColor"/>
      </svg>
      Sin conexión
    </span>
    <h1>Fuera de orbita</h1>
    <p>Parece que no hay conexion a internet en este momento. El cosmos sigue ahi, solo necesita red para hablar contigo.</p>
    <button class="btn" onclick="window.location.reload()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M1.5 7A5.5 5.5 0 0 1 12 4.5M1.5 7l2-2m-2 2-2-2"/>
        <path d="M12.5 7A5.5 5.5 0 0 1 2 9.5M12.5 7l2 2m-2-2-2 2"/>
      </svg>
      Reintentar
    </button>
    <p class="hint">Las lecturas guardadas siguen disponibles si las abriste antes.</p>
  </div>
</body>
</html>
